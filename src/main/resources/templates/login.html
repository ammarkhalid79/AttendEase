<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Sign in', 'login', ~{::main})}">
<main>
<div class="login-panel">
  <div class="login-brand">
    <span class="brand"><i class="bi bi-calendar2-check" aria-hidden="true"></i> AttendEase</span>
    <p class="login-tagline">University attendance, in one place.</p>
  </div>
  <div class="login-form">
    <h1>Sign in</h1>
    <p class="muted">Use your university attendance account.</p>
    <div th:if="${param.error}" class="alert alert-danger" role="alert">Your credentials are invalid or the account is inactive.</div>
    <div th:if="${param.logout}" class="alert alert-success" role="status">You are signed out.</div>
    <form th:action="@{/login}" method="post" class="stack">
      <div><label for="username" class="form-label">Email or username</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
      <div><label for="password" class="form-label">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Sign in <i class="bi bi-arrow-right ms-2" aria-hidden="true"></i></button>
    </form>
  </div>
</div>
</main>
</html>
